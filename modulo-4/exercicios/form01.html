<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        padding: 0px;
        margin: 0px;
      }

      p {
        display: inline-block;
        padding: 0px;
      }

      .formulario {
        position: relative;
        background-color: lightgray;
        color: white;
        border: 1px solid black;
        width: 300px;
        text-align: left;
        margin: auto;
        padding: 30px;
        border-radius: 3px;
      }

      .botao {
        position: absolute;
        margin: auto;
        top: 80%;
        left: 45%;
      }

      .login {
        display: block;
        color: black;
        text-align: center;
        font-size: 2em;
        margin: 0px;
      }
    </style>
  </head>
  <body>
    <h1>Olá, estarei elaborando o meu primeiro formulário</h1>

    <div class="formulario">
      <form>
        <p class="login">Login</p>
        <p>Nome: <input type="text" name="nome" id="nome" /></p>
        <p>Sobrenome: <input type="text" name="sobrenome" id="sobrenome" /></p>
        <input type="button" value="Enviar" class="botao" />
      </form>
    </div>
  </body>
</html>
