<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uso de Iframe</title>
    <style>
      iframe {
        width: 400px;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <h1>
      Testando o uso de um iframe para o meu desenvolvimento como programador
    </h1>
    <p>
      Acessando o site que desejo com iframe
      <!--IFrame serve para abrir outro site dentro do mesmo.
        Quando importamos os vídeos do youtube, fazemos a importação com iframe
      -->

      <!-- Tamanho padrão L300xA150-->
      <iframe
        src="https://www.cursoemvideo.com"
        frameborder="0"
        height="500"
        width="500"
        scolling="yes"
      >
        <a href="https://www.cursoemvideo.com" target="_blank"
          >Curso em video</a
        >
      </iframe>
      para aprender a programar e entre outros cursos que o guanabara oferece.
    </p>
  </body>
</html>
