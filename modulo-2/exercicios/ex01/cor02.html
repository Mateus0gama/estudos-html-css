<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradiante em CSS</title>
    <style>
      * {
        /*Configuração global da css*/
        height: 100%;
      }
      body {
        /*Configuração do corpo da css*/
        background-image: linear-gradient(to right, #364652, #eff2f1, #5b8c5a);
        background-attachment: fixed;
      }
    </style>
  </head>
  <body>
    <h1>Testando Gradiante</h1>
  </body>
</html>
