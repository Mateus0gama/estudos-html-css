<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelo de Caixa</title>
    <style>
      h1 {
        /*Box-level */
        background-color: lightgray;
        width: 300px;
        height: 300px;
        border: 10px solid darkslategray;
        /*border-width: 10px;
        border-style: solid;
        border-color: darkslategray; */

        padding: 10px 10px 10px 10px;
        /*padding-top: 10px;
        padding-right: 10px;
        padding-bottom: 10px;
        padding-left: 10px; */

        margin: 20px auto 10px auto;
        /*margin-top: 20px;
        margin-bottom: 40px;
        margin-left: 10px;
        margin-right: 10px; */

        outline: 5px dashed salmon;
        /*outline-width: 5px;
        outline-style: dashed;
        outline-color: salmon; */

        /*margin: auto;
        Centralizada a margem do texto no meio independente do tamanho da tela
        , ou seja, trás recusividade. */
      }

      a {
        /* Inline-Level*/
        border: 10px solid red; /* Shorthand - Tamanho da borda, Estilo, Cor*/
        padding: 10px 10px 10px 10px; /* Shorthand - Top, Abaixo, esquerda, direita*/
      }
    </style>
  </head>
  <body>
    <h1>Exemplo de caixa box-level</h1>
    <p>
      Parágrafos também são exemplos de box-leve, mas o
      <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como
      tudo isso funciona.
    </p>
  </body>
</html>
