<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Layout - Itens - Area Itens</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
      }

      .conteiner {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 100px);
        border: 2px dashed red;
        gap: 10px;
        margin: 10px
      }

      .caixa1 {
        
        /*
        Shorthand para deliminar as linhas e colunas
        grid-row: 1/2;
        grid-column: 1/5;
        */
        
        grid-area: 1/1/2/5;
        background-color: blue;
      }

      .caixa2 {
        /*
        Shorthand para deliminar as linhas e colunas
        grid-row: 2/4;
        grid-column: 1/3;
        */
        grid-area: 2/1/4/3;
    
        background-color: yellow;
      }

      .caixa3 {

        /*
        Shorthand para deliminar as linhas e colunas
        grid-row: 2/4;
        grid-column: 3/5;
        */
       
        grid-area: 2/3/4/5;
       background-color: green;
      }
    </style>
  </head>
  <body>
    <div class="conteiner">
      <div class="caixa1">A</div>
      <div class="caixa2">B</div>
      <div class="caixa3">C</div>
    </div>
  </body>
</html>
