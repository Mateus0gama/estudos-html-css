<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      div.conteiner {
        background-color: lightsalmon;
        display: flex;
        /* Direção dos itens 
        flex-direction: row;
        /*ABORDADO NA AULA, DIREÇÃO DA QUEBRA DE LINHA
        flex-wrap: wrap; */
        /*shorthand*/
        flex-flow: row wrap;
        /* Organização de como fica disposto os itens no conteiner*/
      }

      div.item {
        background-color: aqua;
        border: 1px solid black;
        text-align: center;
        /* Item flexível automático*/
      }
    </style>
  </head>
  <body>
    <div class="conteiner">
      <div class="item">Exemplo de bloco A</div>
      <div class="item">Exemplo de bloco B</div>
      <div class="item">Exemplo de bloco C</div>
      <div class="item">Exemplo de bloco D</div>
      <div class="item">Exemplo de bloco E</div>
      <div class="item">Exemplo de bloco F</div>
      <div class="item">Exemplo de bloco G</div>
    </div>
  </body>
</html>
