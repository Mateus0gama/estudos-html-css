<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio Grid Layout</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
      }

      main {
        height: 100vh;
        width: 100vw;
      }
      .conteiner {
        display: grid;
        grid-template: 80px 80px 1fr 80px / 3fr 1fr 100px;
        background-color: red;
        justify-content: space-;
        gap: 5px;
      }

      header {
        grid-area: 1/1/2/4;
        background-color: blue;
      }
      menu {
        grid-area: 2/1/3/4;
        background-color: green;
      }
      section {
        grid-area: 3/1/4/3;
        background-color: yellow;
      }
      aside {
        grid-area: 3/3/4/4;
        background-color: blueviolet;
      }
      footer {
        grid-area: 4/1/5/4;
        background-color: chartreuse;
      }
    </style>
  </head>
  <body>
    <main class="conteiner">
      <header class="topo">
        <p>Topo</p>
      </header>
      <menu>
        <p>Menu</p>
      </menu>
      <section>
        <p>Principal</p>
      </section>
      <aside>
        <p>Secundário</p>
      </aside>
      <footer>
        <p>Rodapé</p>
      </footer>
    </main>
  </body>
</html>
