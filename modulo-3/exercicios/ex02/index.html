<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha primeira tabela</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      table {
        margin: auto;
        width: 400px;
        border-collapse: collapse;
      }

      tr.linha {
        background-color: gray;
      }
      td {
        border: 1px solid black;
        padding: 8px;
      }
      td.dado {
        background-color: yellow;
      }
      aside {
        max-width: 700px;
        margin: auto;
      }
      p {
        background-color: gray;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Minha primeira tabela em HTML</h1>
    <!-- 
        Hierarquia de tabela
        TABLE = Tabela = <tr> </tr>
            TABLE ROW = Linha de tabela
                TABLE HEADER = Cabeçalho de tabela
                    TABLE DATA = Dado da tabela (conteúdo)   <td> </td> 
    -->
    <table>
      <tr>
        <!-- Primeira linha da tabela-->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
      </tr>
      <tr class="linha">
        <!-- Segunda linha da tabela-->
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
      </tr>
      <tr>
        <!-- Terceira linha da tabela-->
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
      </tr>
      <tr>
        <!-- Quarta linha da tabela-->
        <td>A4</td>
        <td class="dado">B4</td>
        <td>C4</td>
      </tr>
      <tr>
        <!-- Quinta linha da tabela-->
        <td>A5</td>
        <td>B5</td>
        <td>C5</td>
      </tr>
      <tr>
        <td>A6</td>
        <td>C6</td>
      </tr>
      <tr>
        <td>A7</td>
      </tr>
    </table>
    <aside>
      <p>
        Essa foi a criação da minha primeira tabela em HTML, obrigado por
        verificar até aqui!
      </p>
    </aside>
  </body>
</html>
