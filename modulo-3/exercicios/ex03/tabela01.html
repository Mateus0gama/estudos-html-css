<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha segunda tabela</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      table {
        width: 400px;
        height: 400px;
        border-collapse: collapse;
      }

      td {
        /* Shorthand de bordas sobre a caixa*/
        border: 3px solid black;
        padding: 8px;
        text-align: center; /* Alinhamento Horizontal: Left, Center, Right*/
        vertical-align: middle; /* Alinhamento Vertical: Top, Bottom, middle*/
        font-size: 2em;
      }

      .numero{
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>Minha primeira tabela em HTML</h1>
    <!-- 
        Hierarquia de tabela (simples)
        TABLE = Tabela = <tr> </tr>
            TABLE ROW = Linha de tabela
                TABLE HEADER = Cabeçalho de tabela
                    TABLE DATA = Dado da tabela (conteúdo)   <td> </td> 
    -->
    <table>
      <tr>
        <!-- Primeira linha da tabela-->
        <td>A1</td>
        <td>B1</td>
        <td>C1</td>
      </tr>
      <tr>
        <!-- Segunda linha da tabela-->
        <td>A2</td>
        <td>B2</td>
        <td class="numero">R$300</td>
      </tr>
      <tr>
        <!-- Terceira linha da tabela-->
        <td>A3</td>
        <td>B3</td>
        <td class="numero">R$300</td>
      </tr>
      <tr>
        <!-- Quarta linha da tabela-->
        <td>A4</td>
        <td>B4</td>
        <td>C4</td>
      </tr>
     
    </aside>
  </body>
</html>
